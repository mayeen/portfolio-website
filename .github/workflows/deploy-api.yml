# Deploys api/ to the Azure Function App func-kazishahriar (Flex Consumption, Sweden Central).
# Needs repository secret AZURE_FUNCTIONAPP_PUBLISH_PROFILE (Function App > Overview > Get publish profile).
name: Deploy API to Azure Functions

on:
  push:
    branches: [main]
    paths:
      - api/**
      - scripts/build-content.mjs
      - scripts/sync-cosmos.mjs
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  APP_NAME: func-kazishahriar
  API_URL: https://func-kazishahriar-ffezeph0c2cte9cy.swedencentral-01.azurewebsites.net/api/content

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # API tests import the content scripts (no dependencies needed), so run them before installing.
      - name: Test
        run: node --test "api/test/*.test.mjs"

      - name: Install production dependencies
        working-directory: api
        run: npm ci --omit=dev

      - name: Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.APP_NAME }}
          package: api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          sku: flexconsumption

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/body.json -w '%{http_code}' "$API_URL" || true)
            if [ "$code" = "200" ] && grep -q '"profile"' /tmp/body.json; then echo "API OK"; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 10
          done
          echo "API did not return content"; exit 1

      # Invalid body -> 400 from validation: proves /api/chat is deployed without calling the model (no cost).
      - name: Smoke test chat
        run: |
          code=$(curl -s -o /tmp/chat.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "${API_URL%/content}/chat" || true)
          cat /tmp/chat.json; echo
          if [ "$code" = "400" ]; then echo "Chat OK"; else echo "Chat returned HTTP $code"; exit 1; fi
